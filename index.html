<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrcaRouter | Message Grader</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --border: #e0e0e0;
            --accent: #000000;
            --hover: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            margin-bottom: 40px;
            border-bottom: 2px solid var(--text);
            padding-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -1px;
        }
        p.subtitle {
            font-size: 16px;
            color: #666;
            margin-top: 8px;
        }
        .card {
            border: 1px solid var(--border);
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 0;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: var(--text);
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--hover);
        }
        .result-area {
            display: none;
            margin-top: 40px;
            border-top: 1px solid var(--border);
            padding-top: 30px;
        }
        .copy-box {
            background-color: #f9f9f9;
            padding: 20px;
            border: 1px dashed #ccc;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Message Grader</h1>
            <p class="subtitle">Convert fluff into math-based outreach that actually gets meetings.</p>
        </header>

        <div class="card">
            <label for="context">Prospect Context</label>
            <textarea id="context" placeholder="Paste their LinkedIn post, X thread, or Discord question here..."></textarea>

            <label for="draft">Your Draft Message</label>
            <textarea id="draft" placeholder="Paste the message you want to send..."></textarea>

            <button onclick="generateRequest()">Generate Grading Request</button>
        </div>

        <div id="resultArea" class="result-area">
            <div class="badge">READY TO SEND</div>
            <p>Copy the text below and paste it into your chat with SuperAgent to get your grade and optimization.</p>
            <div id="copyBox" class="copy-box"></div>
            <button onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        function generateRequest() {
            const context = document.getElementById('context').value;
            const draft = document.getElementById('draft').value;

            if (!context || !draft) {
                alert("Please fill in both fields.");
                return;
            }

            const requestText = `Please grade and optimize this outreach message for me.

PROSPECT CONTEXT:
${context}

MY DRAFT MESSAGE:
${draft}

Please provide:
1. A grade out of 10.
2. Specific "fluff" detected.
3. An optimized version (High School reading level, math-focused, no em-dashes).
4. Why the new version will resonate.`;

            document.getElementById('copyBox').innerText = requestText;
            document.getElementById('resultArea').style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        function copyToClipboard() {
            const text = document.getElementById('copyBox').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Copied! Now paste this into your chat with SuperAgent.");
            });
        }
    </script>
</body>
</html>
